name: Deploy staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-manager-staging
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci || npm install
      - name: Run tests
        env:
          EXPO_PUBLIC_BASE_URL: http://localhost:8083
          EXPO_PUBLIC_SCHEME: padeliz-manager://
          EXPO_PUBLIC_API_BASE_URL: http://localhost:8000
          EXPO_PUBLIC_API_VERSION: v1
          EXPO_PUBLIC_API_MANAGER_PREFIX: /api/v1/manager
          EXPO_PUBLIC_APP_NAME: Padeliz Manager
          EXPO_PUBLIC_APP_VERSION: "1.0"
          EXPO_PUBLIC_DEBUG_MODE: "1"
          EXPO_PUBLIC_LOG_LEVEL: info
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          JWT_SECRET: test-jwt-secret-at-least-32-chars-long!!
        run: npm run test:ci

  deploy:
    name: deploy-staging
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            registry.digitalocean.com/padeliz/padeliz-frontend-manager:sha-${{ github.sha }}
            registry.digitalocean.com/padeliz/padeliz-frontend-manager:staging
          build-args: |
            EXPO_PUBLIC_BASE_URL=https://manager.staging.padeliz.ro
            EXPO_PUBLIC_SCHEME=padeliz-manager://
            EXPO_PUBLIC_API_BASE_URL=https://backend.staging.padeliz.ro
            EXPO_PUBLIC_API_VERSION=v1
            EXPO_PUBLIC_API_MANAGER_PREFIX=/api/v1/manager
            EXPO_PUBLIC_APP_NAME=Padeliz Manager
            EXPO_PUBLIC_APP_VERSION=1.0
            EXPO_PUBLIC_DEBUG_MODE=0
            EXPO_PUBLIC_LOG_LEVEL=info
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to App Platform
        uses: digitalocean/app_action/deploy@v2
        env:
          IMAGE_DIGEST_WEB: ${{ steps.build.outputs.digest }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: padeliz-frontend-manager-staging

  smoke:
    name: smoke-web
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Smoke web
        env:
          SMOKE_URL: https://manager.staging.padeliz.ro
          SMOKE_MARKER: Padeliz Manager
        run: bash scripts/ci/smoke-web.sh
