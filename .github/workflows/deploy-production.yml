name: Deploy production

on:
  release:
    types: [published]

concurrency:
  group: deploy-manager-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            registry.digitalocean.com/padeliz/padeliz-frontend-manager:sha-${{ github.sha }}
            registry.digitalocean.com/padeliz/padeliz-frontend-manager:production
          build-args: |
            EXPO_PUBLIC_BASE_URL=https://manager.padeliz.ro
            EXPO_PUBLIC_SCHEME=padeliz-manager://
            EXPO_PUBLIC_API_BASE_URL=https://backend.padeliz.ro
            EXPO_PUBLIC_API_VERSION=v1
            EXPO_PUBLIC_API_MANAGER_PREFIX=/api/v1/manager
            EXPO_PUBLIC_APP_NAME=Padeliz Manager
            EXPO_PUBLIC_APP_VERSION=1.0
            EXPO_PUBLIC_DEBUG_MODE=0
            EXPO_PUBLIC_LOG_LEVEL=info
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to App Platform
        uses: digitalocean/app_action/deploy@v2
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_id: 6b411809-5b9a-4baf-9c24-8d5e56ed6f1a
          app_spec_location: .do/app.production.yaml
